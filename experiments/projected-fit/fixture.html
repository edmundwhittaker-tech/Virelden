<!doctype html><html><head><meta charset="utf-8"><title>Fitted motion comparison — isolated experiment</title><style>body{margin:0;background:#141a1d;color:#ddd;font:14px system-ui}main{width:720px;margin:10px auto}canvas{display:block}select{margin:6px;padding:5px}p{line-height:1.4}</style></head><body><main><h1>Fit first, then motion — native88px comparison</h1><label>Comparison <select id="comparison"><option value="main-fit">Released main / fitted body + original motion</option><option value="fit-projected">Fitted body + original motion / projected experiment</option></select></label><label>Route <select id="route"><option>east</option><option>north</option><option>southeast</option></select></label><div id="game"></div><p>Normal fixed-step150px/s root travel on actual textured floor. Idle→90px travel→stop. Front-template geometry experiment only: no accepted turn/rear/action integration. No gameplay or save capability.</p></main><script type="module">
import Phaser from 'phaser';import {ModularKnightSprite} from '/src/game/ModularKnightSprite.ts';import {evaluateRig} from '/src/core/modularRig.ts';import {evaluateRig as mainRig} from '/tests/fixtures/reference/modularRig-main18e7257.ts';import {WEAPON_CATALOG} from '/src/core/weaponCatalog.ts';import {createLocomotion,advanceLocomotion,locomotionPose} from './projectedLocomotion.ts';import {projectedFitPose} from './projectedFitPose.ts';import floorUrl from '/src/assets/environment-v1/slate-court.webp';
const STEP=1/60,DURATION=2.4;let scene,actors=[],state=createLocomotion(),time=0,accumulator=0,playing=false,ready=false,recording=false,samples=[],frames=0;
const comparison=()=>document.querySelector('#comparison').value,route=()=>document.querySelector('#route').value;
const direction=()=>route()==='north'?{x:0,y:-1}:route()==='southeast'?{x:Math.SQRT1_2,y:Math.SQRT1_2}:{x:1,y:0};
function rootAt(t){const d=direction(),travel=Math.max(0,Math.min(.6,t-.35))*150;return{x:d.x*travel,y:d.y*travel};}
function base(){return route()==='north'?{x:105,y:245}:route()==='southeast'?{x:80,y:180}:{x:70,y:220};}
function reset(){state=createLocomotion();time=0;accumulator=0;playing=false;draw();}
function step(){time=Math.min(DURATION,time+STEP);advanceLocomotion(state,rootAt(time),STEP);}
function snapshot(){const model=locomotionPose(state);return{ready,time,comparison:comparison(),route:route(),root:rootAt(time),model:{mode:model.mode,hipHeight:model.hipHeight,legs:model.legs},actors:actors.map(a=>a.snapshot()),width:720,height:300,scale:1,simulationStep:STEP,movementSpeed:150,gameplayDefaultChanged:false};}
function draw(){if(!ready)return;const root=rootAt(time),b=base(),moving=time>.35&&time<.95,w=WEAPON_CATALOG.sword;
 actors.forEach((a,i)=>a.draw({position:{x:b.x+root.x+i*360,y:b.y+root.y},view:'front',flipped:false,motion:i===1&&comparison()==='fit-projected'?(state.mode==='idle'?'idle':'walk'):moving?'walk':'idle',time,weapon:'sword',weaponHands:w.hands,weaponReach:w.range,weaponMotion:w.motion}));
 if(recording){const p=locomotionPose(state);samples.push({wall:performance.now(),time,root:rootAt(time),mode:p.mode,hipHeight:p.hipHeight,legs:p.legs,rendered:actors[1].snapshot().renderedParts});}
}
class FitMotionScene extends Phaser.Scene{preload(){ModularKnightSprite.preload(this);this.load.image('fit-motion-floor',floorUrl);}create(){scene=this;this.add.tileSprite(0,0,720,300,'fit-motion-floor').setOrigin(0).setDepth(-1000).setAlpha(.5);this.add.line(0,0,360,0,360,300,0x82785e).setOrigin(0).setDepth(2000);actors=[new ModularKnightSprite(this,input=>comparison()==='main-fit'?mainRig(input):evaluateRig(input)),new ModularKnightSprite(this,input=>comparison()==='main-fit'?evaluateRig(input):projectedFitPose(input,state))];this.add.text(10,8,'REFERENCE',{fontSize:'11px',color:'#ddd'}).setDepth(3000);this.add.text(370,8,'CANDIDATE',{fontSize:'11px',color:'#ddd'}).setDepth(3000);ready=true;draw();}update(_t,delta){if(!ready)return;frames++;if(playing){accumulator+=Math.min(.1,delta/1000);while(accumulator>=STEP&&time<DURATION){step();accumulator-=STEP;}if(time>=DURATION)playing=false;}draw();}}
document.querySelector('#comparison').addEventListener('change',reset);document.querySelector('#route').addEventListener('change',reset);
window.fitMotionHarness={get ready(){return ready;},configure({comparison:c,route:r}){document.querySelector('#comparison').value=c;document.querySelector('#route').value=r;reset();return snapshot();},render(t){reset();while(time+STEP<=t+1e-8&&time<DURATION)step();draw();return snapshot();},play(){playing=true;},pause(){playing=false;},snapshot,startRecording(){samples=[];recording=true;},stopRecording(){recording=false;return{samples,frames,duration:time};}};
new Phaser.Game({type:Phaser.CANVAS,parent:'game',width:720,height:300,backgroundColor:'#252b2d',banner:false,scene:[FitMotionScene],fps:{target:60,smoothStep:false},render:{antialias:true,roundPixels:false},audio:{noAudio:true}});
</script></body></html>
