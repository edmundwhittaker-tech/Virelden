<!doctype html><html><head><meta charset="utf-8"><title>Fitted rig physical lever registration</title><style>body{background:#151b1e;color:#ddd;font:14px system-ui}main{width:720px;margin:auto}canvas{display:block}select,input{margin:12px}</style></head><body><main><h1>Fitted rig — fixed feet, actual hand image and lever grip</h1><label>Mechanism <select id="mechanism"></select></label><label>Pull sample <input id="sample" type="range" min="0" max="100" step="1" value="0"></label><div id="game"></div><p>Isolated physical pull audit. Operating stances moved8px screen closer once; mechanism positions and their grip paths are unchanged. Does not establish approach/entry animation acceptance.</p></main><script type="module">
import Phaser from 'phaser';import {ModularKnightSprite} from '/src/game/ModularKnightSprite.ts';import {STATION_GATE} from '/src/core/level.ts';import {EXPEDITIONS} from '/src/core/expeditionCatalog.ts';import {project} from '/src/core/game.ts';
const mechanisms=[{id:'station',...STATION_GATE},...Object.values(EXPEDITIONS).flatMap(a=>a.shortcuts)];const selector=document.querySelector('#mechanism');mechanisms.forEach((m,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=m.id;selector.append(o);});
let scene,actor,g,ready=false,drawId=0,renderedId=-1,target,index=0,sample=0;
class LeverScene extends Phaser.Scene{preload(){ModularKnightSprite.preload(this);}create(){scene=this;g=this.add.graphics();actor=new ModularKnightSprite(this);this.game.events.on(Phaser.Core.Events.POST_RENDER,()=>{renderedId=drawId;});ready=true;draw();}}
function draw(){if(!ready)return;index=Number(selector.value);sample=Number(document.querySelector('#sample').value);drawId++;const m=mechanisms[index],foot=project(m.stance),lever=project(m.lever),t=sample/100,position={x:330,y:275};target={x:position.x+lever.x-13+23*t-foot.x,y:position.y+lever.y-43+13*t-foot.y};
 g.clear();g.lineStyle(1,0x65706f).lineBetween(280,275,380,275);g.lineStyle(4,0x83765d).lineBetween(position.x+lever.x-foot.x,position.y+lever.y-foot.y,target.x,target.y);g.lineStyle(2,0xb6b5a1).strokeCircle(target.x,target.y,2);actor.draw({position,view:'rear',flipped:false,motion:'interact',time:0,progress:t,handTarget:{x:target.x-position.x,y:target.y-position.y}});
}
selector.addEventListener('change',draw);document.querySelector('#sample').addEventListener('input',draw);
window.fittedLeverSnapshot=()=>structuredClone({ready,drawId,renderedId,index,sample,target,mechanism:mechanisms[index],actor:actor?.snapshot()});
new Phaser.Game({type:Phaser.CANVAS,parent:'game',width:720,height:360,backgroundColor:'#222a2d',banner:false,scene:[LeverScene],fps:{target:60,smoothStep:false},render:{antialias:true,roundPixels:false},audio:{noAudio:true}});
</script></body></html>
