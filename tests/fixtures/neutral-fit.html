<!doctype html><html><head><meta charset="utf-8"><title>Neutral armour fit diagnostic — not accepted gameplay</title><style>body{background:#151b1e;color:#d7d1c3;font:14px system-ui}main{width:720px;margin:auto}canvas{display:block}select{padding:6px;margin:8px;color:#ddd;background:#273036}p{line-height:1.4}</style></head><body><main><h1>Neutral armour fit — isolated diagnostic</h1><label>View <select id="view"><option>front</option><option>rear</option><option>front-west</option><option>rear-west</option></select></label><label>Weapon <select id="weapon"><option>sword</option><option>spear</option><option>unarmed</option></select></label><div id="game"></div><p>Top two outfit rows: released main18e7257 reference. Bottom two outfit rows: fit prototype. Six outfits: Ward, Delver, Marcher, then three mixed sets. Native~88px figures. Standing only; walk/contact/interaction changes are NOT accepted by this comparison.</p></main><script type="module">
import Phaser from 'phaser';
import {ModularKnightSprite} from '/src/game/ModularKnightSprite.ts';
import {evaluateRig as mainRig} from './reference/modularRig-main18e7257.ts';
import {WEAPON_CATALOG} from '/src/core/weaponCatalog.ts';
const sets=['ward','delver','marcher'];
const outfits=sets.map(s=>({helmet:s,chest:s,gauntlets:s,legs:s}));
for(let i=0;i<3;i++)outfits.push({helmet:sets[i],chest:sets[(i+1)%3],gauntlets:sets[(i+2)%3],legs:sets[i]});
let scene,actors=[],ready=false,drawId=0,renderedId=-1,errors=[];
class FitScene extends Phaser.Scene{
 preload(){ModularKnightSprite.preload(this);}
 create(){scene=this;for(let row=0;row<2;row++)for(let i=0;i<6;i++){
  const actor=new ModularKnightSprite(this,row===0?mainRig:undefined);if(!actor.setEquipment(outfits[i]))errors.push(`equipment ${row}/${i}`);actors.push(actor);
  const x=95+i%3*240,y=135+Math.floor(i/3)*140+row*300;this.add.line(0,0,x-35,y,x+35,y,0x536061).setOrigin(0).setDepth(-1);
  this.add.text(x,y+14,i<3?sets[i]:`mix${i-2}`,{fontSize:'11px',color:'#bfc6c3'}).setOrigin(.5,0);
 }this.game.events.on(Phaser.Core.Events.POST_RENDER,()=>{renderedId=drawId;});ready=true;draw();}
}
function draw(){if(!ready)return;drawId++;const v=document.querySelector('#view').value,w=document.querySelector('#weapon').value,profile=WEAPON_CATALOG[w];actors.forEach((actor,index)=>actor.draw({position:{x:95+index%3*240,y:135+Math.floor(index%6/3)*140+Math.floor(index/6)*300},view:v.startsWith('rear')?'rear':'front',flipped:v.endsWith('west'),motion:'idle',time:0,...(profile?{weapon:w,weaponHands:profile.hands,weaponMotion:profile.motion,weaponReach:profile.range}:{} )}));}
document.querySelector('#view').addEventListener('change',draw);document.querySelector('#weapon').addEventListener('change',draw);
window.neutralFitSnapshot=()=>structuredClone({ready,drawId,renderedId,view:document.querySelector('#view').value,weapon:document.querySelector('#weapon').value,errors,actors:actors.map(actor=>actor.snapshot()),outfits});
new Phaser.Game({type:Phaser.CANVAS,parent:'game',width:720,height:620,backgroundColor:'#222a2d',banner:false,scene:[FitScene],fps:{target:60,smoothStep:false},render:{antialias:true,roundPixels:false},audio:{noAudio:true}});
</script></body></html>
