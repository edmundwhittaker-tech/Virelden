name: Focused equipment integration QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: virelden-equipment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-equipment:
    if: github.head_ref == 'feature/equipment-campaign-integration' || github.ref == 'refs/heads/feature/equipment-campaign-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Deterministic gameplay, migration, rig and equipment rules
        run: npm test
      - name: Strict TypeScript and production build
        id: build
        run: npm run build
      - run: npx playwright install --with-deps chromium
        id: browser
      - name: Accessible equipment component actual DOM inputs
        run: npx playwright test --config playwright.equipment.config.ts --output test-results/equipment-dom
      - name: Focused playable equipment, save and existing-station inputs
        if: always() && steps.build.outcome == 'success' && steps.browser.outcome == 'success'
        run: npx playwright test browser-tests/courtyard.spec.ts browser-tests/spatial-combat.spec.ts browser-tests/equipment-integration.spec.ts --output test-results/equipment-game
      - name: Preserve compact screenshots and copied states (not dense route traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virelden-focused-equipment-evidence
          path: |
            test-results/**/*.png
            test-results/**/*.json
            test-results/**/*.md
          retention-days: 7
      - name: Preserve the exact built candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virelden-focused-equipment-build
          path: dist/
          retention-days: 7
