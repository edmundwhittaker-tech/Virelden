name: Recover first candidate screenshots
on:
  pull_request:
    paths: ['.github/workflows/recover-first-candidate-evidence.yml']
permissions:
  contents: read
  actions: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve existing first-candidate evidence on the runner
        uses: actions/download-artifact@v4
        with:
          name: virelden-build
          run-id: 39720900811
          github-token: ${{ github.token }}
          path: recovered
      - name: Keep only small screenshot and state evidence
        uses: actions/upload-artifact@v4
        with:
          name: virelden-first-candidate-screenshots
          path: |
            recovered/test-results/**/*.png
            recovered/test-results/**/*.json
            recovered/test-results/**/*.md
          retention-days: 3
