name: Directional player rig milestone (not release acceptance)
on:
  push:
    branches: [qa/player-rig-integration-2026-10-22]
permissions:
  contents: read
jobs:
  native-directional-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Thirteen fixed-model directional and transition geometry tests
        run: |
          npx tsc --strict --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext --rootDir . --outDir .test-directional experiments/authored-jog/directionalJog.ts experiments/authored-jog/gameJog.ts
          node --test experiments/authored-jog/directionalJog.test.mjs
      - name: Install package-lock-pinned normal Chromium
        run: npx playwright install chromium
      - name: Capture eight native headings before encoding-tool download
        env:
          DIRECTIONAL_GAIT_DEFER_TIMING: '1'
        run: npx playwright test --config playwright.directional-fit.config.ts
      - name: Preserve original native pixels and raw geometry first
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-player-early-capture-encoding-audit-pending
          path: test-results/directional-fit
          retention-days: 7
      # Third-party npm repack, not an official/attested FFmpeg build.
      # Use only with trusted locally captured media; never upload this tool.
      - name: Install explicitly pinned encoded-frame timing tool
        run: |
          set -euo pipefail
          test "$(uname -s)-$(uname -m)" = Linux-x86_64
          npm ci --prefix .github/encoding-tools --ignore-scripts --no-audit --no-fund
          probe_dir="$GITHUB_WORKSPACE/.github/encoding-tools/node_modules/@ffprobe-installer/linux-x64"
          printf '%s  %s\n' \
            '576c21674291ec1948d507ea8ab0d78eb6621a0be8c6f1a6db0f50c5fcb1e0f9' \
            "$probe_dir/ffprobe" | sha256sum --check --strict
          chmod u+x "$probe_dir/ffprobe"
          export PATH="$probe_dir:$PATH"
          printf '%s\n' "$probe_dir" >> "$GITHUB_PATH"
          test "$(command -v ffprobe)" = "$probe_dir/ffprobe"
          ffprobe -version
      - name: Mandatory independent encoded-PTS audit of all eight clips
        run: node experiments/projected-fit/auditEncoding.mjs test-results/directional-fit 8
      - name: Revalidate standing and real lever image registration
        run: npx playwright test --config playwright.neutral-fit.config.ts
      - name: Revalidate all actual poleaxe primary and support image grips
        run: npx playwright test --config playwright.poleaxe.config.ts
      - name: Revalidate all six weapons and physical legacy-NPC contacts
        run: npx playwright test --config playwright.contact.config.ts
      - name: Verify all native clips still exist after later renderer suites
        run: node experiments/projected-fit/auditEncoding.mjs test-results/directional-fit 8
      - name: Preserve native milestone and contact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-player-native-evidence
          path: |
            test-results/directional-fit
            test-results/neutral-fit
            test-results/fitted-lever
            test-results/poleaxe-support
            test-results/melee-contact
          retention-days: 7

  native-main-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install package-lock-pinned normal Chromium
        run: npx playwright install chromium
      - name: Fresh UI loadouts and ordinary main-controller input with native crop capture
        env:
          PLAYER_CONTROLLER_DEFER_TIMING: '1'
        run: npx playwright test --config playwright.player-controller.config.ts
      - name: Preserve actual controller pixels before timing-tool download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-controller-early-capture-encoding-audit-pending
          path: test-results/player-controller-native
          retention-days: 7
      # Third-party npm repack, not an official/attested FFmpeg build.
      # Use only with trusted locally captured media; never upload this tool.
      - name: Install explicitly pinned encoded-frame timing tool
        run: |
          set -euo pipefail
          test "$(uname -s)-$(uname -m)" = Linux-x86_64
          npm ci --prefix .github/encoding-tools --ignore-scripts --no-audit --no-fund
          probe_dir="$GITHUB_WORKSPACE/.github/encoding-tools/node_modules/@ffprobe-installer/linux-x64"
          printf '%s  %s\n' \
            '576c21674291ec1948d507ea8ab0d78eb6621a0be8c6f1a6db0f50c5fcb1e0f9' \
            "$probe_dir/ffprobe" | sha256sum --check --strict
          chmod u+x "$probe_dir/ffprobe"
          export PATH="$probe_dir:$PATH"
          printf '%s\n' "$probe_dir" >> "$GITHUB_PATH"
          test "$(command -v ffprobe)" = "$probe_dir/ffprobe"
          ffprobe -version
      - name: Mandatory real encoded-PTS audit of both main-controller clips
        run: node experiments/projected-fit/auditEncoding.mjs test-results/player-controller-native 2
      - name: Preserve controller input events, source-frame snapshots and measured native clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-controller-native-evidence
          path: test-results/player-controller-native
          retention-days: 7
  baseline-browser-and-equipment:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
      - name: Install package-lock-pinned normal Chromium
        id: browser
        run: npx playwright install chromium
      - name: Existing baseline native input, combat, gate approach, save and equipment regressions
        run: npx playwright test --config playwright.config.ts --output test-results/player-baseline-browser
      - name: Isolated equipment DOM contract regressions
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npx playwright test --config playwright.equipment.config.ts --output test-results/player-equipment-browser
      - name: Preserve exact-head baseline and equipment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-rig-baseline-browser-equipment-evidence
          path: test-results
          retention-days: 7

  seeded-expedition-features:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Rules, TypeScript and production build
        run: npm run check
      - name: Install package-lock-pinned normal Chromium
        run: npx playwright install chromium
      - name: Existing seeded expedition geometry, props, save and transition acceptance
        run: npx playwright test --config playwright.expeditions.config.ts --output test-results/player-seeded-expedition-runner
      - name: Preserve seeded feature evidence separately from earned campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-rig-seeded-expedition-feature-evidence
          path: |
            test-results/player-seeded-expedition-runner
            test-results/connected-expeditions
          retention-days: 7

  unseeded-full-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Rules, TypeScript and production build
        run: npm run check
      - name: Install package-lock-pinned normal Chromium
        run: npx playwright install chromium
      - name: Existing earned three-expedition campaign through ordinary keyboard and mouse input
        run: npx playwright test --config playwright.campaign.config.ts --output test-results/player-unseeded-campaign-runner
      - name: Preserve genuine earned-route evidence including any failed stage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-rig-unseeded-full-campaign-evidence
          path: |
            test-results/player-unseeded-campaign-runner
            test-results/native-campaign
          retention-days: 7
